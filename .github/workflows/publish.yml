name: Publish to PyPI

on: workflow_dispatch

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install build twine
      - run: python -m build --sdist
      - run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  windows-install:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - name: Install and exercise the release archive
        shell: pwsh
        run: |
          python -m pip install (Get-ChildItem dist/*.tar.gz).FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import numpy as np; from singlelensfitter import FSPLFitter; t=np.linspace(-5.,5.,301); f=FSPLFitter(); q=np.array([0.,2.,0.12,np.log(0.2)]); y=f._magnification(t,q); r=f.fit(t,y,np.full_like(t,0.01),q); assert r.optimizer_success and r.chi2 < 1e-6"

  publish:
    needs: [build, windows-install]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
